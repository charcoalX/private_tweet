worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    application/xml text/xml;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # General API: 120 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=120r/m;
    # Auth (login/register): 10 req/min per IP — brute-force protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Main server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Use Docker's internal DNS resolver.
        # valid=30s: re-resolve every 30 s so nginx survives service restarts.
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Prevent search engine indexing at the proxy layer
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Using variables with resolver means nginx performs lazy DNS resolution —
        # it won't refuse to start even if an upstream is temporarily down.
        set $api_upstream http://api:3001;
        set $web_upstream http://web:3000;

        # ── Auth routes — strict rate limit ─────────────────────────────────
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # ── All other API routes → Fastify ───────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Next.js static assets — long-lived cache ─────────────────────────
        location /_next/static/ {
            proxy_pass       $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;

            # Immutable: Next.js uses content-hashed filenames
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Robots-Tag  "noindex, nofollow"                   always;
        }

        # ── Everything else → Next.js ────────────────────────────────────────
        location / {
            proxy_pass         $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
