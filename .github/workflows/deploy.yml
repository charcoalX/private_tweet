name: Deploy to GCE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Decode SSH key and deploy
        env:
          GCE_SSH_KEY_B64: ${{ secrets.GCE_SSH_KEY_B64 }}
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ secrets.GCE_USER }}
        run: |
          echo "$GCE_SSH_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $GCE_USER@$GCE_HOST << 'ENDSSH'
            set -e
            cd ~/private_tweet

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Rebuilding and restarting containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

            echo "==> Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T api \
              node_modules/.bin/prisma migrate deploy \
              --schema /app/apps/api/prisma/schema.prisma

            echo "==> Running seed (bootstrap invite code if not exists)..."
            docker compose -f docker-compose.prod.yml exec -T api \
              node_modules/.bin/tsx /app/apps/api/prisma/seed.ts

            echo "==> Deploy complete."
          ENDSSH
